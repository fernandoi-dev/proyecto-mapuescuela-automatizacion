<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Restringido - Mapuescuela</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Nunito', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { border: none; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; padding: 2rem; background: white; }
        .btn-login { background-color: #2B4B85; color: white; font-weight: bold; border-radius: 8px; width: 100%; padding: 10px; }
        .btn-login:hover { background-color: #1a365d; color: white; }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <img src="logomapuescuela.png" alt="Mapuescuela Logo" class="img-fluid mb-3" style="width: 100px;">
        <h4 class="fw-bold mb-1 text-dark">Mapuescuela Admin</h4>
        <p class="text-muted mb-4 small">Ingresa tus credenciales para continuar</p>

        <form id="formLogin">
            <div class="input-group mb-3">
                <span class="input-group-text bg-light"><i class="bi bi-person-fill text-muted"></i></span>
                <input type="text" id="usuario" class="form-control" placeholder="Usuario" required>
            </div>
            <div class="input-group mb-4">
                <span class="input-group-text bg-light"><i class="bi bi-lock-fill text-muted"></i></span>
                <input type="password" id="password" class="form-control" placeholder="Contraseña" required>
            </div>
            
            <div id="error-msg" class="text-danger small mb-3 text-start" style="display: none;">
                <i class="bi bi-exclamation-triangle"></i> Credenciales incorrectas.
            </div>

            <button type="submit" class="btn btn-login">Iniciar Sesión</button>
        </form>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que la página se recargue
            
            const user = document.getElementById('usuario').value;
            const pass = document.getElementById('password').value;

            // Credenciales simuladas para la demostración
            if (user === 'admin' && pass === 'mapuescuela2026') {
                // Redirige al panel real si la contraseña es correcta
                window.location.href = 'panel-admin.html';
            } else {
                // Muestra error
                document.getElementById('error-msg').style.display = 'block';
            }
        });
    </script>
</body>
</html>

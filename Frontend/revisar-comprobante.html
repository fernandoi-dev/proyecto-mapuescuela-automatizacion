<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisar Pago - Mapuescuela</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #F4F1EA; font-family: 'Nunito', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .modern-card { background-color: #F4F1EA; border-radius: 24px; border: none; box-shadow: 9px 9px 16px #d1cec7, -9px -9px 16px #ffffff; padding: 2.5rem 2rem; width: 100%; max-width: 450px; }
        .brand-logo { text-align: center; margin-bottom: 1.5rem; }
        .brand-logo img { width: 100px; height: auto; border-radius: 50%; box-shadow: 5px 5px 10px #d1cec7, -5px -5px 10px #ffffff; }
        .modern-header { text-align: center; margin-bottom: 1.5rem; color: #2B4B85; }
        
        /* Simulación de archivo adjunto */
        .file-preview { background-color: #F4F1EA; border-radius: 12px; padding: 15px; box-shadow: inset 4px 4px 8px #d1cec7, inset -4px -4px 8px #ffffff; text-align: center; color: #2B4B85; font-weight: 600; margin-bottom: 2rem; }
        
        .modern-btn { background-color: #2B4B85; color: white; border: none; border-radius: 12px; padding: 12px; font-weight: 700; box-shadow: 6px 6px 10px 0 #d1cec7, -6px -6px 10px 0 #ffffff; transition: all 0.3s; }
        .modern-btn:hover { background-color: #48B2A6; transform: translateY(2px); box-shadow: 2px 2px 5px 0 #d1cec7, -2px -2px 5px 0 #ffffff; color: white; }
        
        /* Botón secundario para rechazar */
        .modern-btn-outline { background-color: transparent; color: #e63946; border: 2px solid #e63946; border-radius: 12px; padding: 10px; font-weight: 700; transition: all 0.3s; }
        .modern-btn-outline:hover { background-color: #e63946; color: white; box-shadow: 4px 4px 8px #d1cec7, -4px -4px 8px #ffffff; }
    </style>
</head>
<body>
    <div class="modern-card">
        <div class="brand-logo"><img src="logomapuescuela.png" alt="Logo Mapuescuela"></div>
        <div class="modern-header">
            <h4 class="fw-bold">Revisión Administrativa</h4>
            <p class="small" style="color: #48B2A6; font-weight: 600;">Validación de Transferencia #005</p>
        </div>
        
        <div class="file-preview">
            <i class="bi bi-file-earmark-image fs-1 d-block mb-2" style="color: #48B2A6;"></i>
            Transferencia_JuanDiaz.jpg <br>
            <span class="text-muted small">Monto declarado: $15.000</span>
        </div>

        <form id="formularioRevision">
            <div class="d-grid gap-3">
                <button type="submit" class="modern-btn"><i class="bi bi-check-circle me-2"></i>Aprobar Pago</button>
                <button type="button" class="modern-btn-outline" onclick="alert('Pago rechazado. El cliente será notificado.')"><i class="bi bi-x-circle me-2"></i>Rechazar Pago</button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('formularioRevision').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("Pago aprobado con éxito. Avanzando a logística.");
            window.location.href = 'entregar-pedido.html';
        });
    </script>
</body>
</html>

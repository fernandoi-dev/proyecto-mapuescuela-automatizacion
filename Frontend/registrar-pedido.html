<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Pedido - Mapuescuela</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #e0e5ec;
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modern-card {
            background-color: #e0e5ec;
            border-radius: 24px;
            border: none;
            box-shadow: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 450px;
        }
        .modern-header {
            text-align: center;
            margin-bottom: 2rem;
            color: #4a5568;
        }
        .modern-input {
            background-color: #e0e5ec;
            border: none;
            border-radius: 12px;
            padding: 12px 15px;
            color: #4a5568;
            box-shadow: inset 6px 6px 10px 0 rgba(163,177,198, 0.7), inset -6px -6px 10px 0 rgba(255,255,255, 0.8);
        }
        .modern-input:focus {
            background-color: #e0e5ec;
            box-shadow: inset 4px 4px 8px 0 rgba(163,177,198, 0.7), inset -4px -4px 8px 0 rgba(255,255,255, 0.8);
            color: #4a5568;
            outline: none;
        }
        .modern-label {
            font-weight: 700;
            color: #718096;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .modern-btn {
            background-color: #4ade80;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 6px 6px 10px 0 rgba(163,177,198, 0.6), -6px -6px 10px 0 rgba(255,255,255, 0.5);
            transition: all 0.2s ease-in-out;
        }
        .modern-btn:hover {
            background-color: #22c55e;
            transform: translateY(2px);
            box-shadow: 2px 2px 5px 0 rgba(163,177,198, 0.6), -2px -2px 5px 0 rgba(255,255,255, 0.5);
        }
    </style>
</head>
<body>
    <div class="modern-card">
        <div class="modern-header">
            <i class="bi bi-cart-check fs-1 text-success mb-2 d-block"></i>
            <h4 class="fw-bold">Nuevo Pedido</h4>
            <p class="text-muted small">Ingresa los datos para Mapuescuela</p>
        </div>
        
        <form id="formularioPedido">
            <div class="mb-4">
                <label class="modern-label"><i class="bi bi-person me-2"></i>Nombre del Cliente</label>
                <input type="text" class="form-control modern-input" id="nombreCliente" placeholder="Ej: Juan Díaz" required>
            </div>
            <div class="mb-4">
                <label class="modern-label"><i class="bi bi-envelope me-2"></i>Correo Electrónico</label>
                <input type="email" class="form-control modern-input" id="correoCliente" placeholder="juandiaz@gmail.com" required>
            </div>
            <div class="mb-4">
                <label class="modern-label"><i class="bi bi-currency-dollar me-2"></i>Monto a Transferir</label>
                <input type="number" class="form-control modern-input" id="montoTotal" placeholder="15000" required>
            </div>
            <button type="submit" class="w-100 modern-btn mt-3">Registrar y Continuar</button>
        </form>
    </div>

    <script>
        document.getElementById('formularioPedido').addEventListener('submit', function(e) {
            e.preventDefault(); 
            const datos = {
                nombre: document.getElementById('nombreCliente').value,
                correo: document.getElementById('correoCliente').value,
                monto: document.getElementById('montoTotal').value
            };
            alert("Simulación: Datos enviados al backend de Spring Boot.");
        });
    </script>
</body>
</html>

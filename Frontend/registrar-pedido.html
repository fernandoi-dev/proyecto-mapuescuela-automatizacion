<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Pedido - Mapuescuela</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            /* Fondo arena cálido inspirado en la identidad de Mapuescuela */
            background-color: #F4F1EA;
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modern-card {
            background-color: #F4F1EA;
            border-radius: 24px;
            border: none;
            /* Sombras neumórficas ajustadas al nuevo color de fondo */
            box-shadow: 9px 9px 16px #d1cec7, -9px -9px 16px #ffffff;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 450px;
        }
        .brand-logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .brand-logo img {
            width: 130px; /* Tamaño del logo */
            height: auto;
            border-radius: 50%;
            /* Sutil relieve circular para el logo */
            box-shadow: 5px 5px 10px #d1cec7, -5px -5px 10px #ffffff; 
        }
        .modern-header {
            text-align: center;
            margin-bottom: 2rem;
            color: #2B4B85; /* Azul índigo institucional */
        }
        .modern-input {
            background-color: #F4F1EA;
            border: none;
            border-radius: 12px;
            padding: 12px 15px;
            color: #2B4B85;
            box-shadow: inset 6px 6px 10px 0 #d1cec7, inset -6px -6px 10px 0 #ffffff;
        }
        .modern-input:focus {
            background-color: #F4F1EA;
            /* Foco con resplandor turquesa suave */
            box-shadow: inset 4px 4px 8px 0 #d1cec7, inset -4px -4px 8px 0 #ffffff, 0 0 10px rgba(72, 178, 166, 0.4);
            color: #2B4B85;
            outline: none;
        }
        .modern-label {
            font-weight: 700;
            color: #2B4B85; /* Azul índigo */
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .modern-btn {
            background-color: #2B4B85; /* Azul institucional por defecto */
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 6px 6px 10px 0 #d1cec7, -6px -6px 10px 0 #ffffff;
            transition: all 0.3s ease-in-out;
        }
        .modern-btn:hover {
            background-color: #48B2A6; /* Turquesa institucional al pasar el mouse */
            transform: translateY(2px);
            box-shadow: 2px 2px 5px 0 #d1cec7, -2px -2px 5px 0 #ffffff;
            color: white;
        }
    </style>
</head>
<body>
    <div class="modern-card">
        <!-- Logo Mapuescuela -->
        <div class="brand-logo">
            <!-- Asegúrate de tener la imagen 'logo-mapuescuela.png' en la misma carpeta que este HTML -->
            <img src="logomapuescuela.png" alt="Logo Mapuescuela">
        </div>

        <div class="modern-header">
            <h4 class="fw-bold">Nuevo Pedido</h4>
            <p class="small" style="color: #48B2A6; font-weight: 600;">Ingresa los datos del cliente</p>
        </div>
        
        <form id="formularioPedido">
            <div class="mb-4">
                <label class="modern-label"><i class="bi bi-person me-2"></i>Nombre del Cliente</label>
                <input type="text" class="form-control modern-input" id="nombreCliente" placeholder="Ej: Juan Díaz" required>
            </div>
            <div class="mb-4">
                <label class="modern-label"><i class="bi bi-envelope me-2"></i>Correo Electrónico</label>
                <input type="email" class="form-control modern-input" id="correoCliente" placeholder="juandiaz@gmail.com" required>
            </div>
            <div class="mb-4">
                <label class="modern-label"><i class="bi bi-currency-dollar me-2"></i>Monto a Transferir</label>
                <input type="number" class="form-control modern-input" id="montoTotal" placeholder="15000" required>
            </div>
            <button type="submit" class="w-100 modern-btn mt-3">Registrar y Continuar</button>
        </form>
    </div>

    <script>
        document.getElementById('formularioPedido').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("Pedido registrado con éxito.");
            // Redirige automáticamente a la siguiente pantalla
            window.location.href = 'adjuntar-comprobante.html';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logística y Entrega - Mapuescuela</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #F4F1EA; font-family: 'Nunito', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .modern-card { background-color: #F4F1EA; border-radius: 24px; border: none; box-shadow: 9px 9px 16px #d1cec7, -9px -9px 16px #ffffff; padding: 2.5rem 2rem; width: 100%; max-width: 450px; }
        .brand-logo { text-align: center; margin-bottom: 1.5rem; }
        .brand-logo img { width: 130px; height: auto; border-radius: 50%; box-shadow: 5px 5px 10px #d1cec7, -5px -5px 10px #ffffff; }
        .modern-header { text-align: center; margin-bottom: 1.5rem; color: #2B4B85; }
        .modern-label { font-weight: 700; color: #2B4B85; margin-bottom: 8px; font-size: 0.9rem; }
        .modern-select { background-color: #F4F1EA; border: none; border-radius: 12px; padding: 12px 15px; color: #2B4B85; box-shadow: inset 6px 6px 10px 0 #d1cec7, inset -6px -6px 10px 0 #ffffff; width: 100%; cursor: pointer; font-weight: 600; appearance: none; }
        .modern-select:focus { box-shadow: inset 4px 4px 8px 0 #d1cec7, inset -4px -4px 8px 0 #ffffff, 0 0 10px rgba(72, 178, 166, 0.4); outline: none; }
        .modern-input { background-color: #F4F1EA; border: none; border-radius: 12px; padding: 12px 15px; color: #2B4B85; box-shadow: inset 6px 6px 10px 0 #d1cec7, inset -6px -6px 10px 0 #ffffff; width: 100%; }
        .modern-input:focus { box-shadow: inset 4px 4px 8px 0 #d1cec7, inset -4px -4px 8px 0 #ffffff, 0 0 10px rgba(72, 178, 166, 0.4); outline: none; }
        .modern-btn { background-color: #2B4B85; color: white; border: none; border-radius: 12px; padding: 12px; font-weight: 700; font-size: 1rem; box-shadow: 6px 6px 10px 0 #d1cec7, -6px -6px 10px 0 #ffffff; transition: all 0.3s ease-in-out; }
        .modern-btn:hover { background-color: #48B2A6; transform: translateY(2px); box-shadow: 2px 2px 5px 0 #d1cec7, -2px -2px 5px 0 #ffffff; color: white; }
    </style>
</head>
<body>
    <div class="modern-card">
        <div class="brand-logo"><img src="logomapuescuela.png" alt="Logo Mapuescuela"></div>
        <div class="modern-header">
            <h4 class="fw-bold">Gestión de Entrega</h4>
            <p class="small" style="color: #48B2A6; font-weight: 600;">Preparación Final - Pedido #005</p>
        </div>
        
        <form id="formularioEntrega">
            <div class="mb-4">
                <label class="modern-label"><i class="bi bi-box-seam me-2"></i>Modalidad Seleccionada</label>
                <select class="form-select modern-select" id="opcionLogistica" required>
                    <option value="" disabled selected>Seleccione la ruta logística...</option>
                    <option value="retiro">Retiro en Sede Padre Hurtado</option>
                    <option value="despacho">Coordinar Despacho a Domicilio</option>
                </select>
            </div>

            <!-- Campo oculto por defecto -->
            <div class="mb-4" id="cajaDireccion" style="display: none;">
                <label class="modern-label"><i class="bi bi-geo-alt me-2"></i>Dirección de Envío</label>
                <input type="text" class="form-control modern-input" id="direccionDespacho" placeholder="Ej: Av. Las Araucarias 123, Maipú">
            </div>

            <button type="submit" class="w-100 modern-btn mt-3"><i class="bi bi-check2-all me-2"></i>Finalizar Proceso</button>
        </form>
    </div>

    <script>
        // Lógica para mostrar/ocultar dirección
        document.getElementById('opcionLogistica').addEventListener('change', function() {
            var cajaDir = document.getElementById('cajaDireccion');
            var inputDir = document.getElementById('direccionDespacho');
            
            if (this.value === 'despacho') {
                cajaDir.style.display = 'block'; // Muestra el campo
                inputDir.required = true; // Lo hace obligatorio
            } else {
                cajaDir.style.display = 'none'; // Lo oculta
                inputDir.required = false; // Quita la obligatoriedad
                inputDir.value = ''; // Limpia lo escrito
            }
        });

        // Lógica final del formulario
        document.getElementById('formularioEntrega').addEventListener('submit', function(e) {
            e.preventDefault();
            var modalidad = document.getElementById('opcionLogistica').value;
            
            if(modalidad === 'despacho'){
                alert("¡Pedido gestionado! Será despachado a la dirección indicada. Reiniciando demostración...");
            } else {
                alert("¡Pedido gestionado! Listo para ser retirado en sede. Reiniciando demostración...");
            }
            
            window.location.href = 'registrar-pedido.html';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Entrega - Mapuescuela</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #e0e5ec;
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modern-card {
            background-color: #e0e5ec;
            border-radius: 24px;
            border: none;
            box-shadow: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 480px;
        }
        .brand-logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: #22c55e;
            text-align: center;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .modern-input {
            background-color: #e0e5ec;
            border: none;
            border-radius: 12px;
            padding: 12px 15px;
            color: #4a5568;
            box-shadow: inset 6px 6px 10px 0 rgba(163,177,198, 0.7), inset -6px -6px 10px 0 rgba(255,255,255, 0.8);
        }
        .modern-label {
            font-weight: 700;
            color: #718096;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .modern-btn {
            background-color: #22c55e;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 700;
            box-shadow: 6px 6px 10px 0 rgba(163,177,198, 0.6), -6px -6px 10px 0 rgba(255,255,255, 0.5);
        }
    </style>
</head>
<body>
    <div class="modern-card">
        <div class="brand-logo">
            <i class="bi bi-shop"></i> Mapuescuela
        </div>
        <div class="text-center mb-4 text-muted">
            <h4 class="fw-bold text-dark">Gestión de Entrega</h4>
            <p class="small">Preparación y despacho del pedido</p>
        </div>

        <form id="formularioEntrega">
            <div class="mb-4">
                <label class="modern-label"><i class="bi bi-truck me-2"></i>Modalidad Seleccionada</label>
                <input type="text" class="form-control modern-input" value="Retiro en Sede" disabled>
            </div>
            <div class="mb-4">
                <label class="modern-label"><i class="bi bi-box-seam me-2"></i>Productos a Separar</label>
                <textarea class="form-control modern-input" rows="2" disabled>1x Taza Mapuescuela, 2x Cuadernos</textarea>
            </div>
            <button type="submit" class="w-100 modern-btn mt-2">Confirmar Entrega Exitosa</button>
        </form>
    </div>

    <script>
        document.getElementById('formularioEntrega').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("Simulación: Pedido entregado y finalizado correctamente.");
        });
    </script>
</body>
</html>

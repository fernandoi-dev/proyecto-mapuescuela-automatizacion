<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adjuntar Comprobante - Mapuescuela</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #F4F1EA; font-family: 'Nunito', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .modern-card { background-color: #F4F1EA; border-radius: 24px; border: none; box-shadow: 9px 9px 16px #d1cec7, -9px -9px 16px #ffffff; padding: 2.5rem 2rem; width: 100%; max-width: 450px; }
        .brand-logo { text-align: center; margin-bottom: 1.5rem; }
        .brand-logo img { width: 130px; height: auto; border-radius: 50%; box-shadow: 5px 5px 10px #d1cec7, -5px -5px 10px #ffffff; }
        .modern-header { text-align: center; margin-bottom: 1.5rem; color: #2B4B85; }
        .modern-label { font-weight: 700; color: #2B4B85; margin-bottom: 8px; font-size: 0.9rem; }
        .modern-input { background-color: #F4F1EA; border: none; border-radius: 12px; padding: 12px 15px; color: #2B4B85; box-shadow: inset 6px 6px 10px 0 #d1cec7, inset -6px -6px 10px 0 #ffffff; width: 100%; }
        .modern-input:focus { box-shadow: inset 4px 4px 8px 0 #d1cec7, inset -4px -4px 8px 0 #ffffff, 0 0 10px rgba(72, 178, 166, 0.4); outline: none; }
        
        /* Personalización del botón de seleccionar archivo */
        input[type="file"]::file-selector-button { background-color: #2B4B85; color: white; border: none; border-radius: 8px; padding: 8px 12px; margin-right: 15px; transition: 0.3s; cursor: pointer; font-weight: bold; font-family: 'Nunito'; }
        input[type="file"]::file-selector-button:hover { background-color: #48B2A6; }
        
        .modern-btn { background-color: #2B4B85; color: white; border: none; border-radius: 12px; padding: 12px; font-weight: 700; font-size: 1rem; box-shadow: 6px 6px 10px 0 #d1cec7, -6px -6px 10px 0 #ffffff; transition: all 0.3s ease-in-out; }
        .modern-btn:hover { background-color: #48B2A6; transform: translateY(2px); box-shadow: 2px 2px 5px 0 #d1cec7, -2px -2px 5px 0 #ffffff; color: white; }
        
        /* Alerta Neumórfica */
        .alert-custom { background-color: #F4F1EA; border-left: 5px solid #48B2A6; border-radius: 12px; padding: 15px; box-shadow: 5px 5px 10px #d1cec7, -5px -5px 10px #ffffff; margin-bottom: 1.5rem; font-size: 0.85rem; color: #2B4B85; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>
    <div class="modern-card">
        <div class="brand-logo"><img src="logomapuescuela.png" alt="Logo Mapuescuela"></div>
        <div class="modern-header">
            <h4 class="fw-bold">Paso 2: Comprobante</h4>
            <p class="small" id="subtituloPedido" style="color: #48B2A6; font-weight: 600;">Pedido pendiente de pago</p>
        </div>
        
        <div class="alert-custom">
            <i class="bi bi-clock-history fs-4" style="color: #48B2A6;"></i>
            <span>Recuerda: Tienes un plazo de <strong>24 horas</strong> para adjuntar tu comprobante de transferencia.</span>
        </div>

        <form id="formularioComprobante">
            <div class="mb-4">
                <label class="modern-label"><i class="bi bi-upload me-2"></i>Sube tu imagen (JPG, PNG o PDF)</label>
                <input type="file" class="modern-input" id="archivoComprobante" required>
            </div>
            <button type="submit" class="w-100 modern-btn mt-2">Enviar Comprobante</button>
        </form>
    </div>

    <script>
        const pedidoId = sessionStorage.getItem('pedidoId');
        const pedidoTotal = sessionStorage.getItem('pedidoTotal');
        const subtitulo = document.getElementById('subtituloPedido');
        if (pedidoId) {
            subtitulo.textContent = 'Pedido #' + pedidoId + ' - Pendiente de Pago'
                + (pedidoTotal ? ' ($' + pedidoTotal + ')' : '');
        }

        document.getElementById('formularioComprobante').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("Comprobante subido correctamente. El pedido pasa a revisión.");
            window.location.href = 'revisar-comprobante.html';
        });
    </script>
</body>
</html>

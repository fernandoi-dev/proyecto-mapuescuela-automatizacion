spring.application.name=mapuescuela-backend
server.port=8080

# Usuario de la app (créalo en Workbench con el SQL del chat)
spring.datasource.url=jdbc:mysql://localhost:3306/mapuescuela?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flowable crea sus tablas ACT_* en la misma base mapuescuela
flowable.database-schema-update=true
flowable.check-process-definitions=true
flowable.process-definition-location-prefix=classpath*:/processes/
flowable.async-executor-activate=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload.dir=uploads/comprobantes
